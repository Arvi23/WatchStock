name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]  # the end user is on Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: uv sync --frozen
      - run: npm ci
      - name: Scripts parse
        run: for f in static/js/*.js scripts/*.js scripts/*.mjs; do node --check "$f"; done
      - name: Vendored files and compiled CSS are up to date
        run: |
          npm run build
          git diff --exit-code -- static/vendor static/css
      - run: npx playwright install --with-deps chromium
      - name: UI smoke test (fake data)
        # Run the server with the venv's python, not `uv run`: a still-running uv process
        # holds uv's cache lock and breaks setup-uv's post-job cache prune.
        run: |
          .venv/bin/python scripts/fake_server.py &
          SERVER_PID=$!
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8001/api/health && break; sleep 1; done
          node scripts/ui_smoke.js
          kill $SERVER_PID
